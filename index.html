<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Suite - Normativa Argentina</title>

  <!-- Configuración PWA / Mobile -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="./styles.css">
</head>
<body data-theme="light">
  <div class="app-layout">
    
    <!-- Barra lateral / Navegación -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-header">
        <div class="brand-logo">⚖️</div>
        <div class="brand-info">
          <h2>Legal Suite</h2>
          <span class="norma-tag" id="lblNormaActiva">CCyC Ley 26.994</span>
        </div>
      </div>

      <!-- Selector de norma -->
      <div class="selector-box">
        <label for="selectNorma">Normativa:</label>
        <select id="selectNorma" class="custom-select">
          <option value="ccyc">Código Civil y Comercial</option>
          <option value="cn">Constitución Nacional</option>
        </select>
      </div>

      <!-- Índice dinámico de libros/partes -->
      <nav class="nav-index" id="navIndex">
        <!-- Renderizado dinámicamente -->
      </nav>

      <!-- Pie de barra lateral -->
      <div class="sidebar-footer">
        <a href="https://wa.me/5493786401010?text=Hola,%20tengo%20una%20consulta%20sobre%20Legal%20Suite" target="_blank" rel="noopener noreferrer" class="wa-btn" id="btnWhatsapp">
          <span>💬</span>
          <span>Soporte</span>
        </a>
      </div>
    </aside>

    <!-- Contenedor Principal -->
    <main class="main-content">
      
      <!-- Barra superior / Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="btnMobileIndex" class="btn-icon" title="Abrir índice">☰</button>
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="inputBusqueda" placeholder="Buscar por número o palabra clave (ej: 765, alimentos, dominio)..." autocomplete="off">
            <button id="btnClearSearch" class="btn-clear" style="display: none;">✕</button>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Botón de instalación PWA -->
          <button id="btnInstalarApp" class="btn-instalar" style="display: none;">
            📲 Instalar App
          </button>

          <!-- Conmutador de tema -->
          <button id="btnThemeToggle" class="btn-theme" title="Cambiar tema">
            🌓 Modo
          </button>
        </div>
      </header>

      <!-- Barra de accesos rápidos -->
      <section class="quick-access-bar" id="quickAccessBar">
        <!-- Generado dinámicamente según la norma -->
      </section>

      <!-- Contenedor de visualización de artículos -->
      <section class="articles-container" id="articlesContainer">
        <div class="loading-state" id="loadingState">
          <div class="spinner"></div>
          <p>Cargando cuerpo normativo...</p>
        </div>
      </section>

      <!-- Pie de página con copyright -->
      <footer class="app-footer">
        <p>© 2026 Legal Suite • Todos los derechos reservados. Desarrollado para estudiantes y profesionales de Derecho.</p>
      </footer>
    </main>

  </div>

  <script>
    /* ==========================================================================
       ESTADO GLOBAL Y VARIABLES
       ========================================================================== */
    let articulosCCyC = [];
    let articulosCN = [];
    let normaActual = 'ccyc'; // 'ccyc' | 'cn'
    let eventoInstalacion = null;

    const articulosContainer = document.getElementById('articlesContainer');
    const inputBusqueda = document.getElementById('inputBusqueda');
    const btnClearSearch = document.getElementById('btnClearSearch');
    const selectNorma = document.getElementById('selectNorma');
    const navIndex = document.getElementById('navIndex');
    const quickAccessBar = document.getElementById('quickAccessBar');
    const lblNormaActiva = document.getElementById('lblNormaActiva');
    const btnInstalar = document.getElementById('btnInstalarApp');

    /* ==========================================================================
       CARGA DE BASES DE DATOS LOCALES
       ========================================================================== */
    async function cargarBasesDeDatos() {
      try {
        const [resCCyC, resCN] = await Promise.all([
          fetch('./articulos.json').then(r => r.json()).catch(() => []),
          fetch('./constitucion.json').then(r => r.json()).catch(() => [])
        ]);
        
        articulosCCyC = resCCyC;
        articulosCN = resCN;

        document.getElementById('loadingState').style.display = 'none';
        renderizarVista();
      } catch (error) {
        console.error('Error al cargar normativas:', error);
        articulosContainer.innerHTML = '<p class="error-msg">Error al cargar la base de datos. Verifique los archivos JSON.</p>';
      }
    }

    /* ==========================================================================
       GESTIÓN DE TEMAS (CLARO / OSCURO / SEPIA)
       ========================================================================== */
    function aplicarTema(tema) {
      document.body.setAttribute('data-theme', tema);
      localStorage.setItem('suite_tema', tema);
    }

    function toggleTema() {
      const actual = document.body.getAttribute('data-theme') || 'light';
      let siguiente = 'dark';
      if (actual === 'light') siguiente = 'dark';
      else if (actual === 'dark') siguiente = 'sepia';
      else siguiente = 'light';
      aplicarTema(siguiente);
    }

    /* ==========================================================================
       SELECCIÓN DE NORMA Y RENDERIZADO
       ========================================================================== */
    function seleccionarLibro(norma) {
      normaActual = norma;
      localStorage.setItem('suite_norma_activa', norma);
      if (selectNorma) selectNorma.value = norma;
      
      if (norma === 'ccyc') {
        lblNormaActiva.textContent = 'CCyC Ley 26.994';
        renderizarIndiceCCyC();
      } else {
        lblNormaActiva.textContent = 'Constitución de la Nación';
        renderizarIndiceCN();
      }
      
      inputBusqueda.value = '';
      btnClearSearch.style.display = 'none';
      renderizarVista();
    }

    function obtenerArticulosActivos() {
      return normaActual === 'ccyc' ? articulosCCyC : articulosCN;
    }

    function renderizarIndiceCCyC() {
      const libros = [
        { id: 'TITULO PRELIMINAR', label: 'Título Preliminar' },
        { id: 'LIBRO PRIMERO', label: 'Libro I - Parte General' },
        { id: 'LIBRO SEGUNDO', label: 'Libro II - Familia' },
        { id: 'LIBRO TERCERO', label: 'Libro III - Derechos Personales' },
        { id: 'LIBRO CUARTO', label: 'Libro IV - Derechos Reales' },
        { id: 'LIBRO QUINTO', label: 'Libro V - Sucesiones' },
        { id: 'LIBRO SEXTO', label: 'Libro VI - Disp. Comunes' }
      ];

      navIndex.innerHTML = libros.map(l => `
        <button class="index-item" onclick="filtrarPorEstructura('${l.id}')">${l.label}</button>
      `).join('');

      quickAccessBar.innerHTML = `
        <span class="qa-tag" onclick="irArticulo('1')">Art. 1</span>
        <span class="qa-tag" onclick="irArticulo('765')">Art. 765 (Obligaciones)</span>
        <span class="qa-tag" onclick="irArticulo('1092')">Art. 1092 (Consumo)</span>
        <span class="qa-tag" onclick="irArticulo('1708')">Art. 1708 (Resp. Civil)</span>
      `;
    }

    function renderizarIndiceCN() {
      const partes = [
        { id: 'PREAMBULO', label: 'Preámbulo' },
        { id: 'PRIMERA PARTE', label: 'Declaraciones, Derechos y Garantías' },
        { id: 'SEGUNDA PARTE', label: 'Autoridades de la Nación' }
      ];

      navIndex.innerHTML = partes.map(p => `
        <button class="index-item" onclick="filtrarPorEstructura('${p.id}')">${p.label}</button>
      `).join('');

      quickAccessBar.innerHTML = `
        <span class="qa-tag" onclick="irArticulo('Preámbulo')">Preámbulo</span>
        <span class="qa-tag" onclick="irArticulo('14')">Art. 14</span>
        <span class="qa-tag" onclick="irArticulo('14 bis')">Art. 14 bis</span>
        <span class="qa-tag" onclick="irArticulo('19')">Art. 19</span>
        <span class="qa-tag" onclick="irArticulo('75')">Art. 75 inc. 22</span>
      `;
    }

    function renderizarVista(articulos = null) {
      const lista = articulos || obtenerArticulosActivos();
      if (!lista || lista.length === 0) {
        articulosContainer.innerHTML = '<p class="empty-msg">No se encontraron artículos para el criterio seleccionado.</p>';
        return;
      }

      articulosContainer.innerHTML = lista.map(art => `
        <article class="article-card" id="art-${art.numero}">
          <div class="article-header">
            <span class="art-badge">Artículo ${art.numero}</span>
            <span class="art-title">${art.titulo || ''}</span>
          </div>
          <div class="article-body">
            <p>${art.texto || art.contenido || ''}</p>
          </div>
        </article>
      `).join('');
    }

    /* ==========================================================================
       FILTRADO, BÚSQUEDA Y ACCIONES RÁPIDAS
       ========================================================================== */
    function irArticulo(num) {
      inputBusqueda.value = num;
      ejecutarBusqueda();
    }

    function filtrarPorEstructura(filtro) {
      const lista = obtenerArticulosActivos();
      const resultado = lista.filter(a => {
        return (a.libro && a.libro.toUpperCase().includes(filtro)) ||
               (a.parte && a.parte.toUpperCase().includes(filtro));
      });
      renderizarVista(resultado.length > 0 ? resultado : lista);
    }

    function ejecutarBusqueda() {
      const query = inputBusqueda.value.trim().toLowerCase();
      if (!query) {
        btnClearSearch.style.display = 'none';
        renderizarVista();
        return;
      }

      btnClearSearch.style.display = 'inline-flex';
      const lista = obtenerArticulosActivos();

      const filtrados = lista.filter(a => {
        const matchNum = String(a.numero).toLowerCase() === query || String(a.numero).toLowerCase().startsWith(query);
        const matchTitulo = a.titulo ? a.titulo.toLowerCase().includes(query) : false;
        const matchTexto = (a.texto || a.contenido) ? (a.texto || a.contenido).toLowerCase().includes(query) : false;
        return matchNum || matchTitulo || matchTexto;
      });

      renderizarVista(filtrados);
    }

    /* ==========================================================================
       EVENT LISTENERS E INICIALIZACIÓN
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Cargar tema
      aplicarTema(localStorage.getItem('suite_tema') || 'light');
      const btnTema = document.getElementById('btnThemeToggle');
      if (btnTema) btnTema.addEventListener('click', toggleTema);

      // 2. Cargar norma activa
      const normaGuardada = localStorage.getItem('suite_norma_activa') || 'ccyc';
      seleccionarLibro(normaGuardada);

      // 3. Select de norma
      if (selectNorma) {
        selectNorma.addEventListener('change', (e) => seleccionarLibro(e.target.value));
      }

      // 4. Input de búsqueda
      if (inputBusqueda) {
        inputBusqueda.addEventListener('input', ejecutarBusqueda);
      }

      if (btnClearSearch) {
        btnClearSearch.addEventListener('click', () => {
          inputBusqueda.value = '';
          btnClearSearch.style.display = 'none';
          renderizarVista();
        });
      }

      // 5. Cargar datos
      cargarBasesDeDatos();
    });

    /* ==========================================================================
       GESTIÓN DE INSTALACIÓN PWA (BOTÓN NATIVO)
       ========================================================================== */
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      eventoInstalacion = e;
      if (btnInstalar) {
        btnInstalar.style.display = 'inline-flex';
      }
    });

    if (btnInstalar) {
      btnInstalar.addEventListener('click', async () => {
        if (!eventoInstalacion) return;
        eventoInstalacion.prompt();
        const { outcome } = await eventoInstalacion.userChoice;
        console.log(`Resultado de instalación: ${outcome}`);
        btnInstalar.style.display = 'none';
        eventoInstalacion = null;
      });
    }

    window.addEventListener('appinstalled', () => {
      if (btnInstalar) btnInstalar.style.display = 'none';
      console.log('Legal Suite instalada correctamente.');
    });

    /* ==========================================================================
       REGISTRO DEL SERVICE WORKER (OFFLINE)
       ========================================================================== */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((reg) => console.log('Service Worker registrado:', reg.scope))
          .catch((err) => console.log('Error en Service Worker:', err));
      });
    }

    /* ==========================================================================
       ESCUDO DE PROTECCIÓN CONTRA INSPECCIÓN
       ========================================================================== */
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

    document.addEventListener('keydown', function(e) {
      if (
        e.keyCode === 123 || 
        (e.ctrlKey && e.key === 'u') || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 's')
      ) {
        e.preventDefault();
        return false;
      }
    });
  </script>
</body>
</html>
