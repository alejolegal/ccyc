<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Burgundy profundo degradado -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F131E"/>
      <stop offset="50%" stop-color="#5B0F18"/>
      <stop offset="100%" stop-color="#3D080E"/>
    </linearGradient>

    <!-- Clip con esquinas redondeadas -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Fondo -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Balanza vectorial clásica con trazo Soft Cream (#F8F1E7) -->
    <g stroke="#F8F1E7" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Base y mástil central -->
      <line x1="256" y1="80" x2="256" y2="440"/>
      <line x1="160" y1="440" x2="352" y2="440"/>

      <!-- Brazo horizontal -->
      <line x1="100" y1="170" x2="412" y2="170"/>

      <!-- Plato izquierdo -->
      <line x1="100" y1="170" x2="55" y2="295"/>
      <line x1="100" y1="170" x2="145" y2="295"/>
      <path d="M 45 295 Q 100 345 155 295 Z" fill="#F8F1E7" fill-opacity="0.15"/>

      <!-- Plato derecho -->
      <line x1="412" y1="170" x2="367" y2="295"/>
      <line x1="412" y1="170" x2="457" y2="295"/>
      <path d="M 357 295 Q 412 345 467 295 Z" fill="#F8F1E7" fill-opacity="0.15"/>
    </g>

    <!-- Círculo del remate superior -->
    <circle cx="256" cy="80" r="14" fill="#F8F1E7"/>
  </g>
</svg>
